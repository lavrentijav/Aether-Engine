# Manifest for the permissions UI plugin (CMD-33). See crates/aether-plugin/src/manifest.rs.
id = "permissions"
name = "Permissions"
version = "0.1.0"
api = "0.1"
# native: a Rust crate in this workspace, linked in-process (CMD-00N).
# No .wasm entry: the loader calls it directly, no WASM boundary.
priority = 50

capabilities = ["log", "players"]

subscribe = ["on-command"]

requires = ["permissions.admin@0.1"]

commands = [
    { name = "lp", node = "luckperms.command", op = 4 },
    { name = "luckperms", node = "luckperms.command", op = 4 },
    { name = "perms", node = "luckperms.command", op = 4 },
]
