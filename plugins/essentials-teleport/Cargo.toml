[package]
name = "aether-essentials-teleport-plugin"
description = "EssentialsX-style homes, warps and plugin spawn for Aether Engine, on the core teleport API and plugin KV."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "aether_essentials_teleport_plugin"

[dependencies]
# The host trait a native plugin implements, plus the shared `Player`,
# `CommandResult` and teleport-cause types.
aether-plugin = { workspace = true }
# Homes, warps and the plugin spawn persist as small JSON values in plugin KV.
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
