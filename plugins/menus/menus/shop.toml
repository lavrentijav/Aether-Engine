# Example declarative menu: a small shop.
#
# Loaded at startup and on `/menus reload`. `/shop` opens it (permission
# `shop.use`). Every click is intercepted by the core: the items are actions,
# not items a player can take.

name = "shop"
title = "&6&lShop"
layout = "chest6"
# Permission left off so the example opens out of the box: the permission model
# (CMD-01/02) is not landed, so a `permission = "..."` here would deny even an
# operator. Uncomment once the core permission service is present.
# permission = "shop.use"
open_commands = ["shop", "store"]

[[item]]
slot = 49
material = "minecraft:barrier"
name = "&cClose"
lore = ["&7Click to close the shop"]
actions = ["[close]"]

[[item]]
slot = 20
material = "minecraft:iron_sword"
name = "&aBuy an iron sword"
lore = ["&7Costs &e100", "&7Buyer: &e%player%"]
click_condition = "balance>=100"
actions = ["[economy] take 100", "[give] minecraft:iron_sword 1", "[message] &aPurchased!", "[sound] minecraft:entity.player.levelup"]

[[item]]
slot = 24
material = "minecraft:golden_apple"
name = "&6Buy a golden apple"
lore = ["&7Costs &e250"]
click_condition = "balance>=250"
actions = ["[economy] take 250", "[give] minecraft:golden_apple 1", "[message] &aPurchased!"]
