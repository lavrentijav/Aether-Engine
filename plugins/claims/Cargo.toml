[package]
name = "aether-claims-plugin"
description = "The Aether claims plugin, provided as a native plugin: GriefPrevention-style player claims on the core region index."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "aether_claims_plugin"

[dependencies]
# The host trait a native plugin implements, the region write/read hooks and the
# shared `Player`/`CommandResult` types.
aether-plugin = { workspace = true }
# Claim persistence in the plugin KV: one small JSON record per claim.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The e2e trust tests run the written regions through the same core protection
# check the server uses (CMD-29b), not a second copy of its rules.
aether-region = { workspace = true }

[lints]
workspace = true
