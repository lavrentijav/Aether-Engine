# Manifest for the WorldGuard-style regions plugin (CMD-34). See crates/aether-plugin/src/manifest.rs.
id = "regions"
name = "Regions"
version = "0.1.0"
api = "0.1"
# native: a Rust crate in this workspace, linked in-process (CMD-00N).
# No .wasm entry: the loader calls it directly, no WASM boundary.
priority = 20

capabilities = ["log", "config", "supports", "storage.kv", "world.read", "players"]

subscribe = [
    "before-block-break",
    "before-block-place",
    "before-use-item",
    "before-attack",
    "on-command",
    "after-player-join",
]

commands = ["rg", "region"]
