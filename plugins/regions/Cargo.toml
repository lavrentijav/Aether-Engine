[package]
name = "aether-regions-plugin"
description = "WorldGuard-style regions for Aether Engine: a native plugin with /rg define/redefine/remove/priority/info/list over the core region index."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "aether_regions_plugin"

[dependencies]
# The host trait a native plugin implements, plus the shared `Player` and
# `CommandResult` types.
aether-plugin = { workspace = true }
# The one region model/index/store the server's protection hooks consult. The
# plugin never keeps a second spatial index.
aether-region = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
