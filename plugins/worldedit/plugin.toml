# Documentation copy of the build-time manifest in src/lib.rs. A native plugin
# has no runtime plugin.toml; the server collects `registration()` instead.
id = "worldedit"
name = "WorldEdit"
version = "0.1.0"
api = "0.1"
tier = "native"
priority = 20

capabilities = ["log", "config", "world.read", "world.write", "players"]
requires = ["worldedit.host@0.1"]
subscribe = ["before-block-dig", "before-block-interact", "after-player-leave", "on-command"]

commands = [
    { name = "wand", node = "worldedit.wand", op = 0 },
    { name = "pos1", node = "worldedit.selection", op = 0 },
    { name = "pos2", node = "worldedit.selection", op = 0 },
    { name = "sel", node = "worldedit.selection", op = 0 },
    { name = "expand", node = "worldedit.selection", op = 0 },
    { name = "contract", node = "worldedit.selection", op = 0 },
    { name = "set", node = "worldedit.region.set", op = 2 },
    { name = "replace", node = "worldedit.region.replace", op = 2 },
    { name = "walls", node = "worldedit.region.walls", op = 2 },
    { name = "outline", node = "worldedit.region.outline", op = 2 },
    { name = "copy", node = "worldedit.clipboard.copy", op = 0 },
    { name = "cut", node = "worldedit.clipboard.cut", op = 2 },
    { name = "paste", node = "worldedit.clipboard.paste", op = 2 },
    { name = "rotate", node = "worldedit.clipboard.rotate", op = 0 },
    { name = "flip", node = "worldedit.clipboard.flip", op = 0 },
    { name = "stack", node = "worldedit.clipboard.stack", op = 2 },
    { name = "move", node = "worldedit.region.move", op = 2 },
    { name = "schem", node = "worldedit.schematic", op = 2 },
    { name = "brush", node = "worldedit.brush", op = 2 },
    { name = "mask", node = "worldedit.brush.mask", op = 0 },
    { name = "undo", node = "worldedit.history.undo", op = 2 },
    { name = "redo", node = "worldedit.history.redo", op = 2 },
]
