[package]
name = "aether-voice-plugin"
description = "The Aether voice chat plugin (native plugin): a native server side for Simple Voice Chat and Plasmo Voice, with one internal frame and a cross-protocol bridge."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "aether_voice_plugin"

[dependencies]
# The host trait a native plugin implements, the shared `Player`/`CommandResult`
# types and the service registry.
aether-plugin = { workspace = true }
# The AES block cipher the two protocols' crypto modes are built on. Already in
# the workspace lock (the server's online-mode path uses it); GCM and CBC are
# implemented here so no additional crypto crate is pulled in.
aes = "0.8"
cipher = "0.4"
# Random secrets and IVs.
rand = "0.8"

[lints]
workspace = true
