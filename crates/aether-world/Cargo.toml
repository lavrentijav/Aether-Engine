[package]
name = "aether-world"
description = "Aether Engine world model: AVX-Cell / Sub-Chunk SoA memory layout, palette compression and the KV + Zstd storage backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# `fjall` gives the persistent LSM KV backend; `zstd` compresses sub-chunk
# blobs. Both are on by default. `--no-default-features` yields a fully
# dependency-free build (in-memory store + raw blobs) — handy for CI matrices
# and constrained targets.
default = ["fjall", "zstd"]
# The persistent backend also takes an exclusive `flock` on its directory so
# two processes cannot share one world; that is what `dep:libc` (unix only) is
# for. In-memory builds pull neither.
fjall = ["dep:fjall", "dep:libc"]
zstd = ["dep:zstd"]

[dependencies]
aether-core = { workspace = true }
fjall = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# `flock` for the world-directory lock (see `storage::lock`). Only needed by
# the persistent backend, so it is optional and activated by `fjall`.
libc = { version = "0.2", optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "storage"
harness = false
test = false

[[bench]]
name = "visibility"
harness = false
test = false

[[bench]]
name = "pathfind"
harness = false
test = false

[lints]
workspace = true
