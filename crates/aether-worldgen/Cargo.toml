[package]
name = "aether-worldgen"
description = "Aether Engine chunk generation: flat and value-noise terrain generators producing engine sub-chunks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# worldgen only needs the world model types, not the storage backend.
aether-world = { workspace = true, default-features = false }
# Structure templates (`.nbt`) are gzip-compressed; the inflate implementation
# comes from the same crate the converter uses for region chunks.
miniz_oxide = { workspace = true }

[dev-dependencies]
# The parity oracle reads vanilla's own region files: NBT from the converter,
# zlib from the same codec the converter uses.
aether-convert = { path = "../aether-convert", version = "0.1.0", default-features = false }

[lints]
workspace = true
