[package]
name = "aether-server"
description = "Aether Engine minimal join server: a Minecraft 1.8.9 (protocol 47) listener that lets a vanilla client connect and spawn in a full-bright flat world."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "aether-server"

[dependencies]
# `fjall` gives the persistent world store, `zstd` shrinks the sub-chunk blobs
# on disk. Both must stay in step with whatever wrote an existing world: a
# build without `zstd` cannot read blobs a build with it produced.
aether-world = { workspace = true, default-features = false, features = ["fjall", "zstd"] }
aether-api = { workspace = true, default-features = false, features = ["fjall", "zstd"] }
# Named directly so the server can choose between the vanilla generator and the
# built-in noise one; `aether-api` re-exports only the latter.
aether-worldgen = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
# Protocol frame compression (zlib), pure Rust so the server keeps building
# without a C toolchain.
miniz_oxide = { workspace = true }
postgres = { version = "0.19.10", optional = true }

[[bin]]
name = "aether-server"
path = "src/main.rs"

[lints]
workspace = true

[features]
postgres = ["dep:postgres"]
