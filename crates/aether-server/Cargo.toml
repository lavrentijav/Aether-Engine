[package]
name = "aether-server"
description = "Aether Engine minimal join server: a Minecraft 1.8.9 (protocol 47) listener that lets a vanilla client connect and spawn in a full-bright flat world."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "aether-server"

[dependencies]
# `fjall` gives the persistent world store, `zstd` shrinks the sub-chunk blobs
# on disk. Both must stay in step with whatever wrote an existing world: a
# build without `zstd` cannot read blobs a build with it produced.
aether-world = { workspace = true, default-features = false, features = ["fjall", "zstd"] }
aether-api = { workspace = true, default-features = false, features = ["fjall", "zstd"] }
# The shared region model/index/store. The native regions plugin depends on the
# same crate, so both edit and consult one index instead of duplicating it.
aether-region = { workspace = true }
# Named directly so the server can choose between the vanilla generator and the
# built-in noise one; `aether-api` re-exports only the latter.
aether-worldgen = { workspace = true }
# The collision [`BlockView`] the safe-spot search reads. `aether-api` re-exports
# the physics `Body`/`PhysicsParams` but not the view trait, and CMD-31 names it.
aether-physics = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
# The live-ops shape shared with the web admin plugin: the server implements
# the trait, the plugin reads it. Neither names the other.
aether-ops = { workspace = true }
serde_json = { workspace = true }
# Protocol frame compression (zlib), pure Rust so the server keeps building
# without a C toolchain.
miniz_oxide = { workspace = true }
# Online-mode auth: RustCrypto only, no OpenSSL (see `auth::crypto`).
rsa = "0.9"
aes = "0.8"
cfb8 = "0.8"
cipher = "0.4"
sha1 = "0.10"
rand = "0.8"
# The Mojang session-server/profile-API calls. rustls, never OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# The WebAssembly plugin host. Optional so `--no-default-features` builds the
# server without Wasmtime's compile cost and dependency tree.
aether-plugin = { workspace = true, optional = true }
# The SDK native plugin (tier N). Compiled into the server behind `plugins`;
# it registers its services at load, and dependents that require them refuse to
# load when it is disabled. Core code never names it.
aether-sdk-plugin = { path = "../../plugins/sdk", optional = true }
# The menus native plugin (tier N): the shared chest-menu host every other
# plugin opens menus through, and the provider of the `menus` service.
aether-menus-plugin = { path = "../../plugins/menus", optional = true }
aether-webadmin-plugin = { path = "../../plugins/webadmin", optional = true }
# The sidebar native plugin. Loaded after the SDK, so its optional permission
# checks resolve the SDK's service.
aether-sidebar-plugin = { path = "../../plugins/sidebar", optional = true }
# The voice chat native plugin. Loaded last; it owns its UDP server threads.
aether-voice-plugin = { path = "../../plugins/voice", optional = true }
# The staff native plugin: vanish, admin spectate and per-admin anti-xray
# control, driven through the core's `staff_*` host hooks.
aether-staff-plugin = { path = "../../plugins/staff", optional = true }
# The WorldGuard-style regions plugin: the model and `/rg` commands on the
# shared `aether-region` index the protection hooks consult.
aether-regions-plugin = { path = "../../plugins/regions", optional = true }
# The claims native plugin (CMD-35): GriefPrevention-style player claims on the
# core region index, owned through /claim and a golden shovel.
aether-claims-plugin = { path = "../../plugins/claims", optional = true }
# The WorldEdit-style editing native plugin (CMD-36a): selection and fill on
# the core bulk-edit API.
aether-worldedit-plugin = { path = "../../plugins/worldedit", optional = true }
# The essentials-teleport native plugin (CMD-37a): homes, warps and the plugin
# spawn on the core teleport/safe-spot service and plugin KV.
aether-essentials-teleport-plugin = { path = "../../plugins/essentials-teleport", optional = true }
postgres = { version = "0.19.10", optional = true }

[target.'cfg(unix)'.dependencies]
# SIGINT/SIGTERM, for a clean shutdown. Already in the dependency tree (via the
# storage crates), so this adds no new code to the build.
libc = "0.2"

# The server is a library plus a one-line binary, so benches can reach the
# block-write / visibility hot path without starting a listener.
[lib]
name = "aether_server"
path = "src/lib.rs"

[[bin]]
name = "aether-server"
path = "src/main.rs"

[dev-dependencies]
criterion = { workspace = true }
# The unit tests install a per-thread region store; the feature must be on for
# the dependency's `install_test_store` to exist. Production builds do not
# enable it, so the hot-path `store()` stays a plain static read.
aether-region = { workspace = true, features = ["test-store"] }

[[bench]]
name = "visibility"
harness = false
test = false

[[bench]]
name = "command_tree"
harness = false
test = false

[[bench]]
name = "anti_xray"
harness = false
test = false

[[bench]]
name = "ax3c_cells"
harness = false
test = false

[[bench]]
name = "bulk_edit"
harness = false
test = false

[[bench]]
name = "region_index"
harness = false
test = false

[[bench]]
name = "rtp"
harness = false
test = false

[lints]
workspace = true

[features]
# Plugins are on by default for the server binary — the feature exists so a
# build that does not need Wasmtime (tests, a minimal deployment) can drop it
# with `--no-default-features`.
default = ["plugins"]
plugins = ["dep:aether-plugin", "dep:aether-sdk-plugin", "dep:aether-menus-plugin", "dep:aether-webadmin-plugin", "dep:aether-sidebar-plugin", "dep:aether-voice-plugin", "dep:aether-staff-plugin", "dep:aether-regions-plugin", "dep:aether-claims-plugin", "dep:aether-worldedit-plugin", "dep:aether-essentials-teleport-plugin"]
postgres = ["dep:postgres"]
