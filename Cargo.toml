[workspace]
resolver = "2"
members = [
    "crates/aether-core",
    "crates/aether-telemetry",
    "crates/aether-world",
    "crates/aether-net",
    "crates/aether-convert",
    "crates/aether-physics",
    "crates/aether-worldgen",
    "crates/aether-baseproxy",
    "crates/aether-api",
    "crates/aether-plugin",
    "crates/aether-plugin-sdk",
    "crates/aether-demo",
    "crates/aether-server",
    # The SDK, as a native plugin (tier N): an in-process service host other
    # plugins call. Native plugins are compiled into the server, so this one is
    # a workspace member unlike the WASM examples.
    "plugins/sdk",
]

# The example plugins are separate WebAssembly components: they target
# `wasm32-wasip2` and are built on their own (see plugins/examples/*/Makefile),
# not as part of the host workspace.
exclude = ["plugins/examples/hello", "plugins/examples/greet"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lavrentijav/Aether-Engine"
authors = ["Aether Engine contributors"]

[workspace.lints.clippy]
# Keep the SIMD / unsafe surface honest, but do not block the build on pedantic noise.
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
# Generated registry tables are large `const` arrays by design, and the
# protocol/game layers pass many plain values around; these two are noise
# here rather than findings.
large_const_arrays = "allow"
type_complexity = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
aether-core = { path = "crates/aether-core", version = "0.1.0" }
aether-telemetry = { path = "crates/aether-telemetry", version = "0.1.0" }
aether-world = { path = "crates/aether-world", version = "0.1.0", default-features = false }
aether-net = { path = "crates/aether-net", version = "0.1.0" }
aether-physics = { path = "crates/aether-physics", version = "0.1.0" }
aether-worldgen = { path = "crates/aether-worldgen", version = "0.1.0" }
aether-baseproxy = { path = "crates/aether-baseproxy", version = "0.1.0" }
aether-api = { path = "crates/aether-api", version = "0.1.0", default-features = false }
aether-plugin = { path = "crates/aether-plugin", version = "0.1.0" }
# Third-party
# The Wasmtime component model runtime. Kept to the features the plugin host
# uses — JIT, the component model and the default compiler — so the tree does
# not carry async, pooling, profiling or the debug builtins. The floor is the
# RustSec-clean release of this line: 36.0.18 fixes RUSTSEC-2026-0363
# (component-model handle tables charged to no limit) and RUSTSEC-2026-0352
# (wasmtime-wasi filesystem sandbox escape). Do not lower it.
wasmtime = { version = "36.0.18", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }
# Only the WASI 0.2 host surface a `wasm32-wasip2` component needs for Rust's
# standard library; the default `wasmtime-wasi` context grants no filesystem,
# no environment, no arguments and denies by default every network address.
wasmtime-wasi = { version = "36.0.18", default-features = false }
zstd = "0.13"
fjall = "2"
miniz_oxide = "0.8"
criterion = "0.5"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# The whole engine is a hot path; optimise dependencies even in dev builds so
# benchmarks and stress fixtures behave close to release.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
