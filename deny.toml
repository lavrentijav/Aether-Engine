# cargo-deny configuration for the Aether Engine workspace.
# Run with `cargo deny check` (also wired into CI).

[licenses]
# Permissive licenses present in the dependency tree. Workspace crates are
# `MIT OR Apache-2.0`, so both are listed here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    # Pulled in by rustls / ring through the online-mode HTTP client, and by
    # `subtle` under `rsa`.
    "ISC",
    "CDLA-Permissive-2.0",
    # `encoding_rs` (via the Wasmtime component model) and `subtle` (under
    # `rsa`) are BSD-3-Clause: permissive, attribution only.
    "BSD-3-Clause",
]
confidence-threshold = 0.8

[advisories]
# Defaults: deny known vulnerabilities, warn on unmaintained/yanked.
ignore = [
    # RUSTSEC-2023-0071 (Marvin timing side channel) in the RustCrypto `rsa`
    # crate has no patched release. Online-mode login is the only user of a
    # private-key operation, and the task requires RustCrypto with no OpenSSL.
    # The exposure is the standard one every Minecraft server has; the
    # mitigation is to keep login attempts rate-limited and the world's
    # operator list bound, not a dependency swap.
    "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this workspace are declared without a version on
# purpose; do not flag them as wildcard requirements.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
